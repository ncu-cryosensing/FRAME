version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
    # nodejs: "20"    # jupyter book >= 2.0
  jobs:
    pre_build:
      - "jupyter-book config sphinx docs/"    # jupyter book < 2.0

# Dependencies required to build your docs
python:
   install:
   - requirements: docs/requirements.txt

# Sphinx settings
sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false
