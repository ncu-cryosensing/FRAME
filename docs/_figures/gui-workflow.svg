<svg viewBox="0 0 820 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GUI workflow">
    <defs>
      <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d91"/>
      </marker>
      <style>
        .g-box { fill:#eaf1fb; stroke:#0b3d91; stroke-width:2; }
        .g-title { font: bold 13px 'Segoe UI', sans-serif; fill:#0b3d91; text-anchor:middle; }
        .g-sub { font: 11px 'Segoe UI', sans-serif; fill:#5f6368; text-anchor:middle; }
        .g-arrow { stroke:#0b3d91; stroke-width:2; fill:none; marker-end:url(#arrow2); }
      </style>
    </defs>
    <rect class="g-box" x="20"  y="40" width="170" height="60" rx="12"/>
    <text class="g-title" x="105" y="66">1. Open localhost:3000</text>
    <text class="g-sub" x="105" y="86">the GUI landing page</text>

    <rect class="g-box" x="230" y="40" width="180" height="60" rx="12"/>
    <text class="g-title" x="320" y="66">2. Enter URL / upload</text>
    <text class="g-sub" x="320" y="86">JSON · XML · Zenodo · Dataverse</text>

    <rect class="g-box" x="450" y="40" width="150" height="60" rx="12"/>
    <text class="g-title" x="525" y="66">3. Click Assess</text>
    <text class="g-sub" x="525" y="86">wait for the assessment</text>

    <rect class="g-box" x="640" y="40" width="160" height="60" rx="12"/>
    <text class="g-title" x="720" y="66">4. Read the report</text>
    <text class="g-sub" x="720" y="86">FAIR scores + checklist</text>

    <line class="g-arrow" x1="190" y1="70" x2="228" y2="70"/>
    <line class="g-arrow" x1="410" y1="70" x2="448" y2="70"/>
    <line class="g-arrow" x1="600" y1="70" x2="638" y2="70"/>
  </svg>